spring.application.name=erp

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/suminex_erp?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=CHANGE_ME
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

logging.level.org.hibernate.SQL=DEBUG
app.jwt.secret=CHANGE_ME_TO_A_LONG_RANDOM_SECRET_KEY_AT_LEAST_256_BITS
app.jwt.expiration-ms=86400000